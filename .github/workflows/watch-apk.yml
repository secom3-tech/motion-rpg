name: Build Galaxy Watch4 and Fold6 debug APKs

on:
  push:
    branches: [main]
    paths:
      - 'android-watch-bridge/**'
      - '.github/workflows/watch-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android apps and test repetition logic
        run: |
          gradle -p android-watch-bridge --no-daemon :wear:testDebugUnitTest :wear:assembleDebug :mobile:assembleDebug
      - name: Prepare paired installable APK files
        run: |
          mkdir -p watch-apks
          cp android-watch-bridge/mobile/build/outputs/apk/debug/mobile-debug.apk watch-apks/mobile-debug.apk
          cp android-watch-bridge/wear/build/outputs/apk/debug/wear-debug.apk watch-apks/wear-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: watch4-fold6-debug-apks
          path: watch-apks/*.apk
          if-no-files-found: error
          retention-days: 30
